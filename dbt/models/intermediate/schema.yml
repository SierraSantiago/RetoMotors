version: 2

models:
  - name: int_catalog_availability
    columns:
      - name: sku
        tests: [not_null]
      - name: punto_venta_id
        tests: [not_null]

  - name: int_lead_model_match
    columns:
      - name: raw_row_id
        tests: [not_null, unique]
      - name: match_status
        tests:
          - accepted_values:
              arguments:
                values: ['MATCHED', 'REVIEW', 'AMBIGUOUS', 'UNMATCHED', 'MISSING']
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ['normalized_exact', 'alias', 'fuzzy', 'none']
      - name: sku
        tests:
          - relationships:
              arguments:
                to: ref('stg_catalogo_motos')
                field: sku

  - name: int_identity_signals
    columns:
      - name: raw_row_id
        tests: [not_null]
      - name: empresa_id
        tests: [not_null]
      - name: signal_type
        tests:
          - accepted_values:
              arguments:
                values: ['SOURCE_LEAD_ID', 'PHONE', 'EMAIL']
      - name: signal_value
        tests: [not_null]

  - name: int_lead_identity_map
    columns:
      - name: raw_row_id
        tests: [not_null, unique]
      - name: empresa_id
        tests: [not_null]
      - name: customer_identity_id
        tests: [not_null]

  - name: int_customer_identity
    columns:
      - name: customer_identity_id
        tests: [not_null, unique]
      - name: empresa_id
        tests: [not_null]
      - name: lead_count
        tests: [not_null]

  - name: int_conversation_extractions_current
    description: >-
      Extracción SUCCESS vigente por conversación. Grain: one row per
      conversation_id. Selección determinística por processed_at, updated_at
      y extraction_id, conservando lineage del modelo y contrato.
    columns:
      - name: conversation_id
        tests: [not_null, unique]

  - name: int_orphan_conversations
    description: >-
      Auditoría de conversaciones SUCCESS cuyo lead_id es nulo o no existe en
      stg_leads. No crea ni reasigna leads.
    columns:
      - name: conversation_id
        tests: [not_null, unique]
