name: Daily Pipeline

on:
  workflow_dispatch:
    inputs:
      assignment_date:
        description: "YYYY-MM-DD; vacio = fecha actual de Colombia"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install environment
        run: uv sync --dev --frozen

      - name: Resolve assignment date
        shell: bash
        env:
          INPUT_ASSIGNMENT_DATE: ${{ inputs.assignment_date }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_ASSIGNMENT_DATE" ]]; then
            if [[ ! "$INPUT_ASSIGNMENT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "assignment_date debe tener formato YYYY-MM-DD" >&2
              exit 1
            fi
            ASSIGNMENT_DATE="$INPUT_ASSIGNMENT_DATE"
          else
            ASSIGNMENT_DATE="$(TZ=America/Bogota date +%F)"
          fi
          echo "ASSIGNMENT_DATE=$ASSIGNMENT_DATE" >> "$GITHUB_ENV"
          echo "assignment_date=$ASSIGNMENT_DATE"

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL DB_HOST DB_USER DB_PASSWORD DB_NAME OPENAI_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          if [[ ! -f artifacts/ml/propensity_model.joblib ]]; then
            echo "Missing artifact: artifacts/ml/propensity_model.joblib" >&2
            missing=1
          fi
          if [[ ! -f artifacts/ml/propensity_metadata.json ]]; then
            echo "Missing artifact: artifacts/ml/propensity_metadata.json" >&2
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "Preflight passed."

      - name: Run daily pipeline
        run: uv run run-daily-pipeline --skip-ingestion --assignment-date "$ASSIGNMENT_DATE"
