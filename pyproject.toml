[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reto-analista-ia"
version = "0.1.0"
description = "Sistema de priorización comercial de leads para el reto técnico de Analista IA."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "supabase>=2.9,<3",
  "rapidfuzz>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "prefect>=3.0,<4",
  "tenacity>=9.0,<10",
  "langchain>=0.3,<1",
  "langchain-openai>=0.2,<1"
]

[project.scripts]
ingest-data = "reto_ia.ingestion.cli:main"
process-conversations = "reto_ia.llm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
  "dbt-postgres>=1.9,<2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
